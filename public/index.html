<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>浏览器英雄 - 双人射击游戏</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0a0a; color: #fff; overflow: hidden;
        }
        .hud { 
            position: fixed; top: 0; left: 0; right: 0; z-index: 100;
            display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px;
            padding: 10px; background: rgba(0,0,0,0.8);
        }
        .card { 
            background: #1a1a1a; border: 1px solid #333; border-radius: 8px;
            padding: 10px; font-size: 12px;
        }
        .player-card { display: flex; flex-direction: column; gap: 5px; }
        .player-name { font-weight: bold; color: #4CAF50; }
        .player-stats { display: flex; gap: 10px; }
        .stat { display: flex; align-items: center; gap: 3px; }
        .stat-bar { 
            width: 60px; height: 8px; background: #333; border-radius: 4px;
            overflow: hidden;
        }
        .stat-fill { height: 100%; transition: width 0.2s; }
        .hp-fill { background: #f44336; }
        .ult-fill { background: #ff9800; }
        .ammo-fill { background: #2196F3; }
        .controls { font-size: 10px; color: #888; }
        .center-card { text-align: center; }
        .button { 
            background: #333; border: 1px solid #555; color: #fff;
            padding: 5px 10px; border-radius: 4px; cursor: pointer;
            font-size: 11px; margin: 2px;
        }
        .button:hover { background: #444; }
        .button:active { background: #222; }
        .panel { 
            position: fixed; right: 10px; top: 120px; width: 300px;
            background: #1a1a1a; border: 1px solid #333; border-radius: 8px;
            padding: 15px; z-index: 50;
        }
        .panel h3 { margin-bottom: 10px; color: #4CAF50; }
        .input-group { margin-bottom: 10px; }
        .input-group label { display: block; margin-bottom: 3px; font-size: 11px; }
        .input-group input { 
            width: 100%; padding: 5px; background: #333; border: 1px solid #555;
            color: #fff; border-radius: 4px; font-size: 11px;
        }
        .score-display { 
            background: #222; padding: 8px; border-radius: 4px; margin: 5px 0;
            font-size: 11px;
        }
        .leaderboard-table { 
            width: 100%; border-collapse: collapse; font-size: 10px;
            margin-top: 10px;
        }
        .leaderboard-table th, .leaderboard-table td { 
            padding: 3px 5px; text-align: left; border-bottom: 1px solid #333;
        }
        .leaderboard-table th { background: #333; font-weight: bold; }
        .badge { 
            background: #555; padding: 1px 4px; border-radius: 2px;
            font-size: 9px; margin-left: 3px;
        }
        #canvas { 
            display: block; margin: 120px auto 0; border: 1px solid #333;
            background: #000; cursor: crosshair;
        }
        .banner { 
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9); padding: 20px 40px; border-radius: 8px;
            font-size: 24px; font-weight: bold; color: #4CAF50; z-index: 200;
            animation: fadeInOut 1.2s ease-in-out;
        }
        @keyframes fadeInOut {
            0%, 100% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }
        .radar { 
            position: fixed; top: 10px; right: 10px; width: 120px; height: 120px;
            background: rgba(0,0,0,0.8); border: 1px solid #333; border-radius: 50%;
            z-index: 75;
        }
        .status { 
            position: fixed; bottom: 10px; left: 10px; right: 10px;
            background: rgba(0,0,0,0.8); padding: 5px 10px; border-radius: 4px;
            font-size: 11px; z-index: 50;
        }
    </style>
</head>
<body>
    <div class="hud">
        <div class="card player-card">
            <div class="player-name">玩家1</div>
            <div class="player-stats">
                <div class="stat">HP <div class="stat-bar"><div class="stat-fill hp-fill" style="width:100%"></div></div></div>
                <div class="stat">ULT <div class="stat-bar"><div class="stat-fill ult-fill" style="width:0%"></div></div></div>
                <div class="stat">弹药 <div class="stat-bar"><div class="stat-fill ammo-fill" style="width:100%"></div></div></div>
            </div>
            <div class="controls">WASD移动 F射击 Shift冲刺 E护盾 Q大招 R换弹</div>
        </div>
        
        <div class="card center-card">
            <div style="margin-bottom: 5px;">
                <button class="button" onclick="console.log('Button clicked'); startGame();">开始/重开</button>
                <button class="button" onclick="togglePause()">暂停(P)</button>
            </div>
            <div style="font-size: 10px; color: #888;">
                C目标 X波次 T锁定 Y策略 G对战 V分屏 M地图
            </div>
        </div>
        
        <div class="card player-card">
            <div class="player-name">玩家2</div>
            <div class="player-stats">
                <div class="stat">HP <div class="stat-bar"><div class="stat-fill hp-fill" style="width:100%"></div></div></div>
                <div class="stat">ULT <div class="stat-bar"><div class="stat-fill ult-fill" style="width:0%"></div></div></div>
                <div class="stat">弹药 <div class="stat-bar"><div class="stat-fill ammo-fill" style="width:100%"></div></div></div>
            </div>
            <div class="controls">IJKL移动 H射击 O冲刺 U护盾 P大招 ;换弹</div>
        </div>
    </div>

    <div class="panel" id="scorePanel">
        <h3>记分 & 上传</h3>
        <div class="input-group">
            <label>玩家1姓名:</label>
            <input type="text" id="name1" placeholder="玩家1">
        </div>
        <div class="input-group">
            <label>玩家2姓名:</label>
            <input type="text" id="name2" placeholder="玩家2">
        </div>
        <div class="score-display">
            当前分数: <span id="currentScore">0</span><br>
            团队分数: <span id="teamScore">0</span><br>
            最高分数: <span id="highScore">0</span>
        </div>
        <button class="button" onclick="submitScore()">上传成绩</button>
        <button class="button" onclick="clearLocalScores()">清空本地榜</button>
    </div>

    <div class="panel" id="leaderboardPanel" style="top: 400px;">
        <h3>全服排行榜</h3>
        <button class="button" onclick="refreshLeaderboard()">刷新排行榜</button>
        <div id="leaderboardContent"></div>
    </div>

    <canvas id="canvas" width="960" height="540" tabindex="0"></canvas>
    
    <canvas class="radar" id="radar" width="120" height="120"></canvas>
    
    <div class="status" id="status">
        准备开始游戏 - 按空格键或点击"开始/重开"
    </div>

    <script>
        // Backend configuration
        const backend = {
            enabled: true,
            submitUrl: "/api/scores",
            leaderboardUrl: "/api/leaderboard?gameId=browser-hero-demo",
            leaderboardLimit: 10,
            token: null,
            gameId: "browser-hero-demo"
        };

        // Game state
        let canvas, ctx, gameState = {
            running: false, paused: false, wave: 1, score: 0, teamScore: 0,
            players: [], enemies: [], bullets: [], effects: [], obstacles: [],
            objectives: [], camera: { x: 0, y: 0 }, worldSize: { w: 2600, h: 1500 },
            keys: {}, gamepads: {}, lastTime: 0, waveMode: false, pvpMode: false,
            splitScreen: false, hardLock: false, lockStrategy: 0, currentObjective: 0
        };

        // Initialize
        window.onload = function() {
            canvas = document.getElementById('canvas');
            ctx = canvas.getContext('2d');
            
            loadFromStorage();
            setupEventListeners();
            gameLoop();
            
            // Auto-focus canvas
            canvas.focus();
        };

        function setupEventListeners() {
            // Keyboard events
            document.addEventListener('keydown', (e) => {
                const key = e.key.toLowerCase();
                gameState.keys[key] = true;
                
                if (key === ' ') {
                    e.preventDefault();
                    startGame();
                } else if (key === 'p') {
                    e.preventDefault();
                    togglePause();
                } else if (key === 'c') {
                    e.preventDefault();
                    cycleObjective();
                } else if (key === 'x') {
                    e.preventDefault();
                    toggleWaveMode();
                } else if (key === 't') {
                    e.preventDefault();
                    toggleHardLock();
                } else if (key === 'y') {
                    e.preventDefault();
                    cycleLockStrategy();
                } else if (key === 'g') {
                    e.preventDefault();
                    togglePvP();
                } else if (key === 'v') {
                    e.preventDefault();
                    toggleSplitScreen();
                } else if (key === 'm') {
                    e.preventDefault();
                    toggleMapEditor();
                }
            });
            
            document.addEventListener('keyup', (e) => {
                const key = e.key.toLowerCase();
                gameState.keys[key] = false;
            });

            // Gamepad support
            window.addEventListener('gamepadconnected', (e) => {
                console.log('Gamepad connected:', e.gamepad);
            });

            window.addEventListener('gamepaddisconnected', (e) => {
                console.log('Gamepad disconnected:', e.gamepad);
            });
        }

        function loadFromStorage() {
            document.getElementById('name1').value = localStorage.getItem('name1') || '玩家1';
            document.getElementById('name2').value = localStorage.getItem('name2') || '玩家2';
            updateHighScore();
        }

        function saveToStorage() {
            localStorage.setItem('name1', document.getElementById('name1').value);
            localStorage.setItem('name2', document.getElementById('name2').value);
            localStorage.setItem('hiscore.team', gameState.teamScore.toString());
            localStorage.setItem('hiscore.p1', gameState.players[0]?.score?.toString() || '0');
            localStorage.setItem('hiscore.p2', gameState.players[1]?.score?.toString() || '0');
        }

        function updateHighScore() {
            const teamScore = parseInt(localStorage.getItem('hiscore.team') || '0');
            document.getElementById('highScore').textContent = teamScore;
        }

        function startGame() {
            console.log('startGame called');
            gameState.running = true;
            gameState.paused = false;
            gameState.wave = 1;
            gameState.score = 0;
            gameState.teamScore = 0;
            gameState.players = [];
            gameState.enemies = [];
            gameState.bullets = [];
            gameState.effects = [];
            gameState.objectives = [];
            
            // Spawn players near center
            const centerX = gameState.worldSize.w / 2;
            const centerY = gameState.worldSize.h / 2;
            
            console.log('Creating players at center:', centerX, centerY);
            
            gameState.players.push({
                id: 1, x: centerX - 50, y: centerY, vx: 0, vy: 0,
                hp: 100, maxHp: 100, ult: 0, maxUlt: 100, ammo: 30, maxAmmo: 30,
                score: 0, reloading: false, shield: false, dashCooldown: 0,
                color: '#4CAF50', size: 20, gunAngle: 0, lastShot: 0
            });
            
            gameState.players.push({
                id: 2, x: centerX + 50, y: centerY, vx: 0, vy: 0,
                hp: 100, maxHp: 100, ult: 0, maxUlt: 100, ammo: 30, maxAmmo: 30,
                score: 0, reloading: false, shield: false, dashCooldown: 0,
                color: '#2196F3', size: 20, gunAngle: 0, lastShot: 0
            });
            
            console.log('Players spawned:', gameState.players);
            console.log('World size:', gameState.worldSize);
            console.log('Canvas size:', canvas.width, canvas.height);
            
            // Center camera on players
            centerCamera();
            
            // Spawn initial enemies
            spawnWave();
            
            // Show banner
            showBanner('游戏开始！');
            
            // Auto-focus canvas
            canvas.focus();
            canvas.scrollIntoView();
            
            updateStatus('游戏进行中 - 击败敌人获得分数！');
        }

        function centerCamera() {
            if (gameState.players.length === 0) return;
            
            const avgX = gameState.players.reduce((sum, p) => sum + p.x, 0) / gameState.players.length;
            const avgY = gameState.players.reduce((sum, p) => sum + p.y, 0) / gameState.players.length;
            
            // Smooth camera following with interpolation
            const targetX = avgX - canvas.width / 2;
            const targetY = avgY - canvas.height / 2;
            
            // Add smooth interpolation
            const cameraSpeed = 0.1;
            gameState.camera.x += (targetX - gameState.camera.x) * cameraSpeed;
            gameState.camera.y += (targetY - gameState.camera.y) * cameraSpeed;
            
            // Ensure camera doesn't go out of world bounds
            gameState.camera.x = Math.max(0, Math.min(gameState.worldSize.w - canvas.width, gameState.camera.x));
            gameState.camera.y = Math.max(0, Math.min(gameState.worldSize.h - canvas.height, gameState.camera.y));
        }

        function spawnWave() {
            const wave = gameState.wave;
            const enemyCount = Math.min(5 + wave * 2, 20);
            
            for (let i = 0; i < enemyCount; i++) {
                const angle = (Math.PI * 2 * i) / enemyCount;
                const distance = 300 + Math.random() * 200;
                const centerX = gameState.worldSize.w / 2;
                const centerY = gameState.worldSize.h / 2;
                
                gameState.enemies.push({
                    x: centerX + Math.cos(angle) * distance,
                    y: centerY + Math.sin(angle) * distance,
                    vx: 0, vy: 0, hp: 30 + wave * 10, maxHp: 30 + wave * 10,
                    size: 12, color: '#f44336', lastShot: 0, isBoss: wave % 5 === 0 && i === 0
                });
                
                if (gameState.enemies[gameState.enemies.length - 1].isBoss) {
                    const boss = gameState.enemies[gameState.enemies.length - 1];
                    boss.hp = 200 + wave * 50;
                    boss.maxHp = boss.hp;
                    boss.size = 25;
                    boss.color = '#9C27B0';
                }
            }
        }

        function showBanner(text) {
            const banner = document.createElement('div');
            banner.className = 'banner';
            banner.textContent = text;
            document.body.appendChild(banner);
            
            setTimeout(() => {
                document.body.removeChild(banner);
            }, 1200);
        }

        function togglePause() {
            if (gameState.running) {
                gameState.paused = !gameState.paused;
                updateStatus(gameState.paused ? '游戏暂停' : '游戏进行中');
            }
        }

        function cycleObjective() {
            const objectives = ['单点', '移动点', '双点', '载具(推车)'];
            gameState.currentObjective = (gameState.currentObjective + 1) % objectives.length;
            updateStatus(`目标模式: ${objectives[gameState.currentObjective]}`);
        }

        function toggleWaveMode() {
            gameState.waveMode = !gameState.waveMode;
            updateStatus(gameState.waveMode ? '波次模式开启' : '波次模式关闭');
        }

        function toggleHardLock() {
            gameState.hardLock = !gameState.hardLock;
            updateStatus(gameState.hardLock ? '硬锁定开启' : '硬锁定关闭');
        }

        function cycleLockStrategy() {
            const strategies = ['最近', '低血量', '锥形'];
            gameState.lockStrategy = (gameState.lockStrategy + 1) % strategies.length;
            updateStatus(`锁定策略: ${strategies[gameState.lockStrategy]}`);
        }

        function togglePvP() {
            gameState.pvpMode = !gameState.pvpMode;
            updateStatus(gameState.pvpMode ? 'PVP模式开启' : 'PVP模式关闭');
        }

        function toggleSplitScreen() {
            gameState.splitScreen = !gameState.splitScreen;
            updateStatus(gameState.splitScreen ? '分屏模式开启' : '分屏模式关闭');
        }

        function toggleMapEditor() {
            updateStatus('地图编辑器模式 (工具: 1障碍/2生成点/3可破坏)');
        }

        function updateStatus(text) {
            document.getElementById('status').textContent = text;
        }

        function gameLoop(currentTime = 0) {
            if (!gameState.lastTime) gameState.lastTime = currentTime;
            const deltaTime = currentTime - gameState.lastTime;
            gameState.lastTime = currentTime;
            
            if (gameState.running && !gameState.paused) {
                update(deltaTime);
            }
            
            render();
            updateHUD();
            updateRadar();
            
            requestAnimationFrame(gameLoop);
        }

        function update(deltaTime) {
            const dt = deltaTime / 1000;
            
            // Update players
            updatePlayers(dt);
            
            // Update enemies
            updateEnemies(dt);
            
            // Update bullets
            updateBullets(dt);
            
            // Update effects
            updateEffects(dt);
            
            // Update camera
            centerCamera();
            
            // Check wave completion
            if (gameState.waveMode && gameState.enemies.length === 0) {
                gameState.wave++;
                spawnWave();
                showBanner(`第 ${gameState.wave} 波！`);
            }
            
            // Update team score
            gameState.teamScore = gameState.players.reduce((sum, p) => sum + p.score, 0);
            document.getElementById('currentScore').textContent = gameState.teamScore;
            document.getElementById('teamScore').textContent = gameState.teamScore;
        }

        function updatePlayers(dt) {
            gameState.players.forEach((player, index) => {
                // Input handling
                const controls = index === 0 ? 
                    { up: 'w', down: 's', left: 'a', right: 'd', shoot: 'f', dash: 'shift', shield: 'e', ult: 'q', reload: 'r' } :
                    { up: 'i', down: 'k', left: 'j', right: 'l', shoot: 'h', dash: 'o', shield: 'u', ult: 'p', reload: ';' };
                
                // Movement
                let vx = 0, vy = 0;
                const speed = 200;
                
                if (gameState.keys[controls.up]) vy -= speed;
                if (gameState.keys[controls.down]) vy += speed;
                if (gameState.keys[controls.left]) vx -= speed;
                if (gameState.keys[controls.right]) vx += speed;
                
                // Normalize diagonal movement
                if (vx !== 0 && vy !== 0) {
                    vx *= 0.707;
                    vy *= 0.707;
                }
                
                player.vx = vx;
                player.vy = vy;
                
                // Update position
                player.x += player.vx * dt;
                player.y += player.vy * dt;
                
                // World bounds
                player.x = Math.max(player.size, Math.min(gameState.worldSize.w - player.size, player.x));
                player.y = Math.max(player.size, Math.min(gameState.worldSize.h - player.size, player.y));
                
                // Shooting
                if (gameState.keys[controls.shoot] && player.ammo > 0 && !player.reloading && Date.now() - player.lastShot > 150) {
                    shoot(player, index);
                }
                
                // Reloading
                if (gameState.keys[controls.reload] && !player.reloading) {
                    player.reloading = true;
                    setTimeout(() => {
                        player.ammo = player.maxAmmo;
                        player.reloading = false;
                    }, 1000);
                }
                
                // Shield
                if (gameState.keys[controls.shield]) {
                    player.shield = true;
                } else {
                    player.shield = false;
                }
                
                // Dash
                if (gameState.keys[controls.dash] && player.dashCooldown <= 0) {
                    player.x += player.vx * dt * 3;
                    player.y += player.vy * dt * 3;
                    player.dashCooldown = 2;
                }
                
                if (player.dashCooldown > 0) {
                    player.dashCooldown -= dt;
                }
                
                // Ult charge
                if (player.ult < player.maxUlt) {
                    player.ult += 10 * dt;
                }
                
                // Ult usage
                if (gameState.keys[controls.ult] && player.ult >= player.maxUlt) {
                    useUlt(player);
                }
            });
        }

        function shoot(player, playerIndex) {
            if (player.ammo <= 0) return;
            
            player.ammo--;
            player.lastShot = Date.now();
            
            // Find nearest enemy for aim
            let targetAngle = player.gunAngle;
            if (gameState.enemies.length > 0) {
                const nearest = findNearestEnemy(player);
                if (nearest) {
                    targetAngle = Math.atan2(nearest.y - player.y, nearest.x - player.x);
                }
            }
            
            // Create bullet
            const bulletSpeed = 400;
            gameState.bullets.push({
                x: player.x + Math.cos(targetAngle) * player.size,
                y: player.y + Math.sin(targetAngle) * player.size,
                vx: Math.cos(targetAngle) * bulletSpeed,
                vy: Math.sin(targetAngle) * bulletSpeed,
                size: 3, color: player.color, playerId: player.id, damage: 25
            });
            
            // Muzzle flash effect
            gameState.effects.push({
                x: player.x + Math.cos(targetAngle) * player.size,
                y: player.y + Math.sin(targetAngle) * player.size,
                type: 'muzzle', life: 0.1, maxLife: 0.1, size: 8
            });
        }

        function useUlt(player) {
            player.ult = 0;
            
            // Create explosion effect
            gameState.effects.push({
                x: player.x, y: player.y, type: 'explosion', life: 0.5, maxLife: 0.5, size: 100
            });
            
            // Damage all enemies in range
            gameState.enemies.forEach(enemy => {
                const dist = Math.sqrt((enemy.x - player.x) ** 2 + (enemy.y - player.y) ** 2);
                if (dist < 150) {
                    enemy.hp -= 100;
                    if (enemy.hp <= 0) {
                        killEnemy(enemy, player);
                    }
                }
            });
        }

        function findNearestEnemy(player) {
            let nearest = null;
            let minDist = Infinity;
            
            gameState.enemies.forEach(enemy => {
                const dist = Math.sqrt((enemy.x - player.x) ** 2 + (enemy.y - player.y) ** 2);
                if (dist < minDist) {
                    minDist = dist;
                    nearest = enemy;
                }
            });
            
            return nearest;
        }

        function updateEnemies(dt) {
            gameState.enemies.forEach((enemy, index) => {
                // Find nearest player
                let nearestPlayer = null;
                let minDist = Infinity;
                
                gameState.players.forEach(player => {
                    const dist = Math.sqrt((enemy.x - player.x) ** 2 + (enemy.y - player.y) ** 2);
                    if (dist < minDist) {
                        minDist = dist;
                        nearestPlayer = player;
                    }
                });
                
                if (nearestPlayer) {
                    // Move towards player
                    const angle = Math.atan2(nearestPlayer.y - enemy.y, nearestPlayer.x - enemy.x);
                    const speed = enemy.isBoss ? 50 : 80;
                    
                    enemy.vx = Math.cos(angle) * speed;
                    enemy.vy = Math.sin(angle) * speed;
                    
                    enemy.x += enemy.vx * dt;
                    enemy.y += enemy.vy * dt;
                    
                    // Enemy shooting
                    if (Date.now() - enemy.lastShot > 1000) {
                        enemy.lastShot = Date.now();
                        
                        const bulletSpeed = 200;
                        gameState.bullets.push({
                            x: enemy.x,
                            y: enemy.y,
                            vx: Math.cos(angle) * bulletSpeed,
                            vy: Math.sin(angle) * bulletSpeed,
                            size: 2, color: '#f44336', playerId: 0, damage: 10
                        });
                    }
                }
            });
            
            // Remove dead enemies
            gameState.enemies = gameState.enemies.filter(enemy => enemy.hp > 0);
        }

        function updateBullets(dt) {
            gameState.bullets.forEach((bullet, bulletIndex) => {
                bullet.x += bullet.vx * dt;
                bullet.y += bullet.vy * dt;
                
                // Remove bullets that are out of bounds
                if (bullet.x < 0 || bullet.x > gameState.worldSize.w || 
                    bullet.y < 0 || bullet.y > gameState.worldSize.h) {
                    gameState.bullets.splice(bulletIndex, 1);
                    return;
                }
                
                // Check collision with enemies (player bullets)
                if (bullet.playerId > 0) {
                    gameState.enemies.forEach((enemy, enemyIndex) => {
                        const dist = Math.sqrt((bullet.x - enemy.x) ** 2 + (bullet.y - enemy.y) ** 2);
                        if (dist < enemy.size + bullet.size) {
                            enemy.hp -= bullet.damage;
                            gameState.bullets.splice(bulletIndex, 1);
                            
                            // Hurt effect
                            gameState.effects.push({
                                x: enemy.x, y: enemy.y, type: 'hurt', life: 0.2, maxLife: 0.2, size: 15
                            });
                            
                            if (enemy.hp <= 0) {
                                const player = gameState.players.find(p => p.id === bullet.playerId);
                                if (player) killEnemy(enemy, player);
                            }
                        }
                    });
                }
                
                // Check collision with players (enemy bullets)
                if (bullet.playerId === 0) {
                    gameState.players.forEach(player => {
                        if (player.shield) return; // Shield blocks bullets
                        
                        const dist = Math.sqrt((bullet.x - player.x) ** 2 + (bullet.y - player.y) ** 2);
                        if (dist < player.size + bullet.size) {
                            player.hp -= bullet.damage;
                            gameState.bullets.splice(bulletIndex, 1);
                            
                            // Hurt effect
                            gameState.effects.push({
                                x: player.x, y: player.y, type: 'hurt', life: 0.2, maxLife: 0.2, size: 15
                            });
                            
                            if (player.hp <= 0) {
                                gameOver();
                            }
                        }
                    });
                }
            });
        }

        function killEnemy(enemy, player) {
            const score = enemy.isBoss ? 1000 : 100;
            player.score += score;
            gameState.score += score;
            
            // Pop effect
            gameState.effects.push({
                x: enemy.x, y: enemy.y, type: 'pop', life: 0.3, maxLife: 0.3, size: enemy.size
            });
            
            // Debris effect
            for (let i = 0; i < 5; i++) {
                gameState.effects.push({
                    x: enemy.x + (Math.random() - 0.5) * 20,
                    y: enemy.y + (Math.random() - 0.5) * 20,
                    type: 'debris', life: 1, maxLife: 1, size: 3,
                    vx: (Math.random() - 0.5) * 100,
                    vy: (Math.random() - 0.5) * 100
                });
            }
        }

        function updateEffects(dt) {
            gameState.effects.forEach((effect, index) => {
                effect.life -= dt;
                
                if (effect.type === 'debris') {
                    effect.x += effect.vx * dt;
                    effect.y += effect.vy * dt;
                }
                
                if (effect.life <= 0) {
                    gameState.effects.splice(index, 1);
                }
            });
        }

        function gameOver() {
            gameState.running = false;
            saveToStorage();
            updateStatus('游戏结束 - 按空格键重新开始');
            showBanner('游戏结束！');
        }

        function render() {
            // Clear canvas
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Save context for camera transform
            ctx.save();
            ctx.translate(-gameState.camera.x, -gameState.camera.y);
            
            // Draw grid background
            drawGrid();
            
            // Draw obstacles
            drawObstacles();
            
            // Draw objectives
            drawObjectives();
            
            // Draw effects
            drawEffects();
            
            // Draw bullets
            drawBullets();
            
            // Draw enemies
            drawEnemies();
            
            // Draw players
            drawPlayers();
            
            // Debug: Draw a test circle at screen center
            ctx.fillStyle = '#ff0000';
            ctx.beginPath();
            ctx.arc(canvas.width/2, canvas.height/2, 30, 0, Math.PI * 2);
            ctx.fill();
            
            // Debug info (only log occasionally)
            if (gameState.running && Math.random() < 0.01) {
                console.log('Camera:', gameState.camera);
                console.log('Players:', gameState.players.length);
            }
            
            // Restore context
            ctx.restore();
        }

        function drawGrid() {
            const gridSize = 50;
            const startX = Math.floor(gameState.camera.x / gridSize) * gridSize;
            const startY = Math.floor(gameState.camera.y / gridSize) * gridSize;
            const endX = startX + canvas.width + gridSize;
            const endY = startY + canvas.height + gridSize;
            
            ctx.strokeStyle = '#1a1a1a';
            ctx.lineWidth = 1;
            
            for (let x = startX; x <= endX; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, startY);
                ctx.lineTo(x, endY);
                ctx.stroke();
            }
            
            for (let y = startY; y <= endY; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(startX, y);
                ctx.lineTo(endX, y);
                ctx.stroke();
            }
        }

        function drawObstacles() {
            // Placeholder for obstacles
        }

        function drawObjectives() {
            // Placeholder for objectives
        }

        function drawEffects() {
            gameState.effects.forEach(effect => {
                const alpha = effect.life / effect.maxLife;
                ctx.globalAlpha = alpha;
                
                switch (effect.type) {
                    case 'muzzle':
                        ctx.fillStyle = '#ffff00';
                        ctx.beginPath();
                        ctx.arc(effect.x, effect.y, effect.size * alpha, 0, Math.PI * 2);
                        ctx.fill();
                        break;
                    case 'hurt':
                        ctx.fillStyle = '#ff0000';
                        ctx.beginPath();
                        ctx.arc(effect.x, effect.y, effect.size * alpha, 0, Math.PI * 2);
                        ctx.fill();
                        break;
                    case 'pop':
                        ctx.fillStyle = '#ff8800';
                        ctx.beginPath();
                        ctx.arc(effect.x, effect.y, effect.size * alpha, 0, Math.PI * 2);
                        ctx.fill();
                        break;
                    case 'explosion':
                        ctx.fillStyle = '#ff4400';
                        ctx.beginPath();
                        ctx.arc(effect.x, effect.y, effect.size * alpha, 0, Math.PI * 2);
                        ctx.fill();
                        break;
                    case 'debris':
                        ctx.fillStyle = '#888888';
                        ctx.fillRect(effect.x, effect.y, effect.size, effect.size);
                        break;
                }
            });
            
            ctx.globalAlpha = 1;
        }

        function drawBullets() {
            gameState.bullets.forEach(bullet => {
                ctx.fillStyle = bullet.color;
                ctx.beginPath();
                ctx.arc(bullet.x, bullet.y, bullet.size, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        function drawEnemies() {
            gameState.enemies.forEach(enemy => {
                // Enemy body
                ctx.fillStyle = enemy.color;
                ctx.beginPath();
                ctx.arc(enemy.x, enemy.y, enemy.size, 0, Math.PI * 2);
                ctx.fill();
                
                // Health bar
                const barWidth = enemy.size * 2;
                const barHeight = 4;
                const healthPercent = enemy.hp / enemy.maxHp;
                
                ctx.fillStyle = '#333';
                ctx.fillRect(enemy.x - barWidth/2, enemy.y - enemy.size - 10, barWidth, barHeight);
                
                ctx.fillStyle = '#f44336';
                ctx.fillRect(enemy.x - barWidth/2, enemy.y - enemy.size - 10, barWidth * healthPercent, barHeight);
            });
        }

        function drawPlayers() {
            gameState.players.forEach((player, index) => {
                
                // Player body with border
                ctx.fillStyle = player.color;
                ctx.beginPath();
                ctx.arc(player.x, player.y, player.size, 0, Math.PI * 2);
                ctx.fill();
                
                // White border for visibility
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(player.x, player.y, player.size, 0, Math.PI * 2);
                ctx.stroke();
                
                // Shield effect
                if (player.shield) {
                    ctx.strokeStyle = '#00ffff';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(player.x, player.y, player.size + 8, 0, Math.PI * 2);
                    ctx.stroke();
                }
                
                // Gun (larger and more visible)
                ctx.fillStyle = '#333';
                ctx.fillRect(player.x - 3, player.y - player.size - 10, 6, 12);
                
                // Health bar
                const barWidth = player.size * 2;
                const barHeight = 6;
                const healthPercent = player.hp / player.maxHp;
                
                ctx.fillStyle = '#333';
                ctx.fillRect(player.x - barWidth/2, player.y - player.size - 20, barWidth, barHeight);
                
                ctx.fillStyle = '#4CAF50';
                ctx.fillRect(player.x - barWidth/2, player.y - player.size - 20, barWidth * healthPercent, barHeight);
            });
        }

        function updateHUD() {
            gameState.players.forEach((player, index) => {
                const playerCard = document.querySelectorAll('.player-card')[index];
                const hpBar = playerCard.querySelector('.hp-fill');
                const ultBar = playerCard.querySelector('.ult-fill');
                const ammoBar = playerCard.querySelector('.ammo-fill');
                
                hpBar.style.width = (player.hp / player.maxHp * 100) + '%';
                ultBar.style.width = (player.ult / player.maxUlt * 100) + '%';
                ammoBar.style.width = (player.ammo / player.maxAmmo * 100) + '%';
            });
        }

        function updateRadar() {
            const radar = document.getElementById('radar');
            const radarCtx = radar.getContext('2d');
            
            // Clear radar
            radarCtx.fillStyle = 'rgba(0,0,0,0.8)';
            radarCtx.fillRect(0, 0, radar.width, radar.height);
            
            // Draw radar circle
            radarCtx.strokeStyle = '#333';
            radarCtx.lineWidth = 1;
            radarCtx.beginPath();
            radarCtx.arc(radar.width/2, radar.height/2, radar.width/2 - 5, 0, Math.PI * 2);
            radarCtx.stroke();
            
            // Scale factor for radar
            const scale = radar.width / 400;
            
            // Draw players on radar
            gameState.players.forEach(player => {
                const radarX = (player.x - gameState.camera.x) * scale;
                const radarY = (player.y - gameState.camera.y) * scale;
                
                if (radarX >= 0 && radarX < radar.width && radarY >= 0 && radarY < radar.height) {
                    radarCtx.fillStyle = player.color;
                    radarCtx.beginPath();
                    radarCtx.arc(radarX, radarY, 3, 0, Math.PI * 2);
                    radarCtx.fill();
                }
            });
            
            // Draw enemies on radar
            gameState.enemies.forEach(enemy => {
                const radarX = (enemy.x - gameState.camera.x) * scale;
                const radarY = (enemy.y - gameState.camera.y) * scale;
                
                if (radarX >= 0 && radarX < radar.width && radarY >= 0 && radarY < radar.height) {
                    radarCtx.fillStyle = enemy.color;
                    radarCtx.beginPath();
                    radarCtx.arc(radarX, radarY, 2, 0, Math.PI * 2);
                    radarCtx.fill();
                }
            });
        }

        // Leaderboard functions
        async function submitScore() {
            if (!backend.enabled || !gameState.running) return;
            
            const name1 = document.getElementById('name1').value || '玩家1';
            const name2 = document.getElementById('name2').value || '玩家2';
            
            const players = [];
            if (gameState.players[0] && gameState.players[0].score > 0) {
                players.push({ name: name1, score: gameState.players[0].score });
            }
            if (gameState.players[1] && gameState.players[1].score > 0) {
                players.push({ name: name2, score: gameState.players[1].score });
            }
            
            if (players.length === 0) {
                alert('没有可上传的分数！');
                return;
            }
            
            const data = {
                gameId: backend.gameId,
                players: players,
                team: gameState.teamScore,
                mode: gameState.waveMode ? 1 : 0,
                wave: gameState.wave,
                timestamp: Date.now()
            };
            
            try {
                const response = await fetch(backend.submitUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        ...(backend.token && { 'Authorization': `Bearer ${backend.token}` })
                    },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                if (result.ok) {
                    alert('分数上传成功！');
                    refreshLeaderboard();
                } else {
                    alert('上传失败: ' + (result.error || '未知错误'));
                }
            } catch (error) {
                alert('上传失败: ' + error.message);
            }
        }

        async function refreshLeaderboard() {
            if (!backend.enabled) return;
            
            try {
                const response = await fetch(backend.leaderboardUrl + `&limit=${backend.leaderboardLimit}`);
                const result = await response.json();
                
                if (result.ok) {
                    displayLeaderboard(result.leaderboard);
                } else {
                    document.getElementById('leaderboardContent').innerHTML = '<p>加载失败</p>';
                }
            } catch (error) {
                document.getElementById('leaderboardContent').innerHTML = '<p>网络错误</p>';
            }
        }

        function displayLeaderboard(leaderboard) {
            const content = document.getElementById('leaderboardContent');
            
            if (leaderboard.length === 0) {
                content.innerHTML = '<p>暂无数据</p>';
                return;
            }
            
            let html = '<table class="leaderboard-table">';
            html += '<tr><th>排名</th><th>玩家</th><th>分数</th><th>时间</th></tr>';
            
            leaderboard.forEach((entry, index) => {
                const date = new Date(entry.timestamp);
                const timeStr = date.toLocaleDateString() + ' ' + date.toLocaleTimeString();
                
                html += '<tr>';
                html += `<td>${index + 1}</td>`;
                html += `<td>${entry.name}</td>`;
                html += `<td>${entry.score}`;
                if (entry.mode !== null) html += `<span class="badge">M${entry.mode}</span>`;
                if (entry.wave !== null) html += `<span class="badge">W${entry.wave}</span>`;
                html += '</td>';
                html += `<td>${timeStr}</td>`;
                html += '</tr>';
            });
            
            html += '</table>';
            content.innerHTML = html;
        }

        function clearLocalScores() {
            localStorage.removeItem('hiscore.team');
            localStorage.removeItem('hiscore.p1');
            localStorage.removeItem('hiscore.p2');
            updateHighScore();
            alert('本地分数已清空');
        }

        // Initialize leaderboard on load
        window.addEventListener('load', () => {
            refreshLeaderboard();
        });
    </script>
</body>
